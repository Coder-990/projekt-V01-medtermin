spring.application.name=medtermin
server.port=8080
# Lokalni zadani prihvat; za drugi bind potrebno je izričito postaviti SERVER_ADDRESS.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Baza je u memoriji; aplikacija je namijenjena lokalnom razvoju, ne produkciji.
spring.datasource.url=jdbc:h2:mem:medtermin;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Postavke aplikacije
app.naziv=MedTermin
app.storage-dir=./data/dokumenti
app.mailbox-dir=./data/posta
app.cors.allowed-origins=http://localhost:5173,https://sigurni-portal.hr

# Samo lokalni HTTP razvoj; u produkciji postaviti APP_COOKIE_SECURE=true uz HTTPS.
app.cookie-secure=${APP_COOKIE_SECURE:true}
