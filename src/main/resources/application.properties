spring.application.name=medtermin
server.port=8081

# Baza u memoriji; shema iz schema.sql, početne podatke puni PocetniPodaci.java
spring.datasource.url=jdbc:h2:mem:medtermin;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

server.error.include-stacktrace=never
server.error.include-message=never

# Postavke aplikacije
app.naziv=MedTermin
app.storage-dir=./data/dokumenti
app.mailbox-dir=./data/posta
app.cors.allowed-origins=http://localhost:5173
